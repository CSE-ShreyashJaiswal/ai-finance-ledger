server:
  port: 8080

spring:
  application:
    name: ai-finance-ledger

  # ── DataSource (local Docker Postgres) ──
  datasource:
    url: jdbc:postgresql://localhost:5432/finance_ledger
    username: ledger_user
    password: ledger_pass
    driver-class-name: org.postgresql.Driver

  # ── JPA / Hibernate ──
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  # ── Flyway ──
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

# ── JWT ──
jwt:
  secret: ai-finance-ledger-secret-key-that-is-at-least-256-bits-long-for-hs256
  expiration: 86400000   # 24 hours in milliseconds

# ── Logging ──
logging:
  level:
    root: INFO
    com.financeledger: DEBUG
