services:
  postgres:
    image: postgres:16-alpine
    container_name: finance-ledger-db
    environment:
      POSTGRES_DB: finance_ledger
      POSTGRES_USER: ledger_user
      POSTGRES_PASSWORD: ledger_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger_user -d finance_ledger"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
